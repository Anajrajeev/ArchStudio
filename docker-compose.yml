version: "3.9"

services:
  backend:
    build:
      # Repo root, so the image can include shared/python (the scene-graph models).
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Must match where the Dockerfile puts it, or dev and the built image disagree about
      # where `shared.python.models` lives — which is how this went unnoticed until E5.
      - ./shared:/app/shared
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - BYOK_ENCRYPTION_KEY=${BYOK_ENCRYPTION_KEY}
      - CORS_ORIGINS=["http://localhost:5173"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  # export-service is Phase 6 — uncomment then
